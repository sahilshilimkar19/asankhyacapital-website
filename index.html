<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asankhya Capital — Coming Soon</title>

  <!-- SEO -->
  <meta name="description" content="Asankhya Capital — an investment firm founded on clarity, conviction, and long-term value. Our website is launching soon." />
  <link rel="canonical" href="https://asankhyacapital.com/" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#070b16" />

  <!-- Open Graph / social preview -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Asankhya Capital" />
  <meta property="og:title" content="Asankhya Capital — Coming Soon" />
  <meta property="og:description" content="An investment firm founded on clarity, conviction, and long-term value. Launching soon." />
  <meta property="og:url" content="https://asankhyacapital.com/" />
  <meta property="og:image" content="https://asankhyacapital.com/assets/img/og-image.svg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Asankhya Capital — Coming Soon" />
  <meta name="twitter:description" content="An investment firm founded on clarity, conviction, and long-term value. Launching soon." />
  <meta name="twitter:image" content="https://asankhyacapital.com/assets/img/og-image.svg" />

  <!-- Favicon -->
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/assets/img/favicon.svg" />

  <style>
    /* ---------- Reset ---------- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-1: #070b16;
      --bg-2: #0d1526;
      --ink: #eef2f8;
      --muted: #9aa6bd;
      --muted-dim: #6b7793;
      --gold: #c6a15b;
      --gold-soft: rgba(198, 161, 91, 0.16);
      --hairline: rgba(255, 255, 255, 0.10);
      --font-serif: Georgia, "Times New Roman", "Iowan Old Style", "Palatino Linotype", serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html { -webkit-text-size-adjust: 100%; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-1);
      color: var(--ink);
      font-family: var(--font-sans);
      line-height: 1.6;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      position: relative;
      padding: 2rem 1.25rem;
    }

    /* ---------- Ambient background ---------- */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(1200px 700px at 50% -10%, rgba(198, 161, 91, 0.12), transparent 60%),
        radial-gradient(900px 600px at 85% 110%, rgba(41, 70, 120, 0.28), transparent 60%),
        linear-gradient(180deg, var(--bg-2) 0%, var(--bg-1) 55%, #05070f 100%);
    }
    /* Slow drifting glow */
    body::after {
      content: "";
      position: fixed;
      inset: -20%;
      z-index: -1;
      background: radial-gradient(420px 420px at 30% 40%, rgba(198, 161, 91, 0.06), transparent 70%);
      animation: drift 22s ease-in-out infinite alternate;
    }
    @keyframes drift {
      0%   { transform: translate3d(-4%, -2%, 0) scale(1); }
      100% { transform: translate3d(6%, 4%, 0) scale(1.15); }
    }

    /* ---------- Layout ---------- */
    main {
      width: 100%;
      max-width: 640px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: rise 1s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ---------- Monogram ---------- */
    .monogram {
      width: 76px;
      height: 76px;
      border: 1px solid var(--gold);
      border-radius: 50%;
      display: grid;
      place-items: center;
      margin-bottom: 2.25rem;
      box-shadow: 0 0 0 6px var(--gold-soft), inset 0 0 24px rgba(198, 161, 91, 0.08);
    }
    .monogram span {
      font-family: var(--font-serif);
      font-size: 2.1rem;
      color: var(--gold);
      line-height: 1;
      transform: translateY(1px);
    }

    /* ---------- Wordmark ---------- */
    .wordmark {
      font-family: var(--font-serif);
      font-weight: 400;
      font-size: clamp(2.5rem, 8vw, 4rem);
      letter-spacing: 0.02em;
      color: var(--ink);
      line-height: 1.05;
    }
    .wordmark .sub {
      display: block;
      margin-top: 0.85rem;
      font-family: var(--font-sans);
      font-size: clamp(0.72rem, 2.4vw, 0.9rem);
      font-weight: 500;
      letter-spacing: 0.42em;
      text-indent: 0.42em; /* optical centering for tracked text */
      text-transform: uppercase;
      color: var(--gold);
    }

    /* ---------- Divider ---------- */
    .divider {
      width: 56px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 2rem 0 1.75rem;
    }

    /* ---------- Status badge ---------- */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }
    .badge .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 0 0 rgba(198, 161, 91, 0.6);
      animation: pulse 2.4s ease-out infinite;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(198, 161, 91, 0.5); }
      70%  { box-shadow: 0 0 0 9px rgba(198, 161, 91, 0); }
      100% { box-shadow: 0 0 0 0 rgba(198, 161, 91, 0); }
    }

    /* ---------- Copy ---------- */
    .tagline {
      font-family: var(--font-serif);
      font-size: clamp(1.15rem, 3.6vw, 1.5rem);
      font-style: italic;
      color: var(--ink);
      max-width: 30ch;
    }
    .description {
      margin-top: 1.15rem;
      font-size: clamp(0.95rem, 2.6vw, 1.05rem);
      color: var(--muted);
      max-width: 46ch;
    }

    /* ---------- Contact ---------- */
    .contact {
      margin-top: 2.5rem;
    }
    .contact a {
      display: inline-block;
      padding: 0.85rem 1.9rem;
      border: 1px solid var(--hairline);
      border-radius: 999px;
      color: var(--ink);
      text-decoration: none;
      font-size: 0.9rem;
      letter-spacing: 0.04em;
      transition: border-color 0.25s ease, color 0.25s ease, background 0.25s ease, transform 0.25s ease;
    }
    .contact a:hover,
    .contact a:focus-visible {
      border-color: var(--gold);
      color: var(--gold);
      background: var(--gold-soft);
      transform: translateY(-2px);
    }

    /* ---------- Footer ---------- */
    footer {
      margin-top: 3.5rem;
      font-size: 0.78rem;
      color: var(--muted-dim);
      letter-spacing: 0.02em;
    }
    footer a {
      color: var(--muted);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: color 0.2s ease, border-color 0.2s ease;
    }
    footer a:hover,
    footer a:focus-visible { color: var(--gold); border-color: var(--gold); }
    footer .sep { margin: 0 0.6rem; opacity: 0.5; }

    /* ---------- Focus visibility ---------- */
    a:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

    /* ---------- Reduced motion ---------- */
    @media (prefers-reduced-motion: reduce) {
      body::after, main, .badge .dot { animation: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <div class="monogram" aria-hidden="true"><span>A</span></div>

    <h1 class="wordmark">
      Asankhya
      <span class="sub">Capital</span>
    </h1>

    <div class="divider" role="presentation"></div>

    <p class="badge"><span class="dot" aria-hidden="true"></span> Launching Soon</p>

    <p class="tagline">Boundless opportunity. Disciplined capital.</p>

    <p class="description">
      An investment firm founded on clarity, conviction, and long-term value.
      Our full website is on the way.
    </p>

    <div class="contact">
      <a href="mailto:contact@asankhyacapital.com">Get in touch</a>
    </div>

    <footer>
      <span>&copy; 2026 Asankhya Capital</span>
      <!-- Replace or remove the link below once social profiles are live -->
      <span class="sep" aria-hidden="true">·</span>
      <a href="mailto:contact@asankhyacapital.com">contact@asankhyacapital.com</a>
    </footer>
  </main>
</body>
</html>
