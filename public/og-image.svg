      <stop offset="1" stop-color="#0A2240"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Ring flourish bleeding off the right edge -->
  <circle cx="1120" cy="315" r="180" fill="none" stroke="rgba(201,165,103,0.25)" stroke-width="1.5"/>
