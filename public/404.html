<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — Asankhya Capital</title>
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#FBFAF7" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    @font-face {
      font-family: "Fraunces";
      src: url("/fonts/fraunces-v1.woff2") format("woff2");
      font-weight: 100 900;
      font-display: swap;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #FBFAF7; --paper-deep: #F4F0E8;
      --ink: #17130C; --ink-2: #4E4839;
      --bronze: #9A742F; --bronze-ink: #77591F;
      --hairline: rgba(23, 19, 12, 0.14);
      --serif: "Fraunces", Georgia, "Iowan Old Style", serif;
      --sans: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background:
        radial-gradient(900px 500px at 50% -10%, rgba(154, 116, 47, 0.06), transparent 60%),
        linear-gradient(180deg, #FDFCFA, var(--paper) 40%, var(--paper-deep) 130%);
      color: var(--ink); font-family: var(--sans); text-align: center;
      padding: 2rem 1.25rem; -webkit-font-smoothing: antialiased;
    }
    .code {
      font-family: var(--serif); font-weight: 380;
      font-size: clamp(4.5rem, 16vw, 7.5rem); color: var(--bronze); line-height: 1;
      font-optical-sizing: auto;
    }
    h1 { font-family: var(--serif); font-weight: 420; font-size: clamp(1.4rem, 5vw, 2rem); margin-top: 1.25rem; }
    p { color: var(--ink-2); margin-top: 1rem; max-width: 42ch; line-height: 1.65; }
    a {
      display: inline-block; margin-top: 2.25rem; color: var(--ink); text-decoration: none;
      font-size: 0.95rem; letter-spacing: 0.02em; padding-bottom: 2px; position: relative;
    }
    a::after {
      content: ""; position: absolute; left: 0; bottom: 0; width: 100%; height: 1px;
      background: var(--bronze); transform: scaleX(0); transform-origin: left;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    a:hover, a:focus-visible { color: var(--bronze-ink); }
    a:hover::after, a:focus-visible::after { transform: scaleX(1); }
    a:focus-visible { outline: 2px solid var(--bronze); outline-offset: 4px; }
  </style>
</head>
<body>
  <div class="code">404</div>
  <h1>Page Not Found</h1>
  <p>The page you're looking for doesn't exist yet — our site is still coming together.</p>
  <a href="/">Return home &rarr;</a>
</body>
</html>
